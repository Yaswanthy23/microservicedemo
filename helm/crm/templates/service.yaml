{{- range $key, $service := .Values.services }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $service.name }}
  namespace: {{ $service.namespace }}
  labels:
    app: {{ $service.name }}
spec:
  type: {{ $service.serviceType }}
  selector:
    app: {{ $service.name }}
  ports:
    - name: http
      protocol: TCP
      port: {{ $service.port }}
      targetPort: http
---
{{- end }}
